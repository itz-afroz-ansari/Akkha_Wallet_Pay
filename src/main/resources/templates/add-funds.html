<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Funds - Akhha Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .page-wrap {
            max-width: 540px;
            margin: 0 auto;
            padding: 40px 18px 60px;
        }
        .method-tile-select {
            position: relative;
            cursor: pointer;
            display: block;
        }
        .method-tile-select input[type="radio"] {
            position: absolute;
            opacity: 0;
        }
        .method-tile-face {
            border: 1.5px solid var(--border-subtle);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            background: #ffffff;
            transition: all 0.2s ease;
        }
        .method-tile-select input:checked + .method-tile-face {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a th:href="@{/dashboard}" class="btn-outline-custom mb-4 py-2 px-3 fw-bold small">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>

        <div class="card-modern shadow-lg">
            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="quick-action-icon icon-emerald" style="width:46px; height:46px; font-size:1.2rem;">
                    <i class="bi bi-plus-circle-fill"></i>
                </div>
                <div>
                    <span class="text-uppercase fw-bold text-muted" style="font-size: 0.68rem; letter-spacing: 0.12em;">TOP UP WALLET</span>
                    <h3 class="fw-bold mb-0">Add Funds</h3>
                </div>
            </div>

            <p class="text-muted small mb-4">Add demo / test funds to your wallet to try instant transfers, bill payments, and investments.</p>

            <!-- Alerts -->
            <div th:if="${txSuccess}" class="alert alert-success border-0 rounded-3 mb-3" th:text="${txSuccess}"></div>
            <div th:if="${txError}" class="alert alert-danger border-0 rounded-3 mb-3" th:text="${txError}"></div>

            <!-- Balance Mini Card -->
            <div class="d-flex justify-content-between align-items-center p-3 rounded-4 mb-4" style="background: #f8fafc; border: 1px solid var(--border-subtle);">
                <div>
                    <div class="text-uppercase fw-bold text-muted" style="font-size: 0.68rem; letter-spacing: 0.1em;">CURRENT BALANCE</div>
                    <div class="fw-extrabold fs-5 text-dark" th:text="'₹' + ${#numbers.formatDecimal(user.wallet.balance,1,2)}">₹0.00</div>
                </div>
                <span class="status-badge completed"><i class="bi bi-check-circle-fill"></i> READY</span>
            </div>

            <form th:action="@{/dashboard/add-funds/demo}" method="post" id="demoTopupForm">
                <input type="hidden" name="operationKey" th:value="${operationKey}">

                <label class="form-label-custom">Select Payment Method</label>
                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <label class="method-tile-select">
                            <input type="radio" name="paymentMethod" value="DEBIT_CARD" checked>
                            <div class="method-tile-face">
                                <div class="quick-action-icon icon-blue p-2" style="width:38px; height:38px; font-size:1.1rem;">
                                    <i class="bi bi-credit-card"></i>
                                </div>
                                <div>
                                    <div class="fw-bold small">Debit Card</div>
                                    <div class="text-muted" style="font-size:0.7rem;">Simulated bank</div>
                                </div>
                            </div>
                        </label>
                    </div>
                    <div class="col-6">
                        <label class="method-tile-select">
                            <input type="radio" name="paymentMethod" value="CREDIT_CARD">
                            <div class="method-tile-face">
                                <div class="quick-action-icon icon-purple p-2" style="width:38px; height:38px; font-size:1.1rem;">
                                    <i class="bi bi-credit-card-2-front"></i>
                                </div>
                                <div>
                                    <div class="fw-bold small">Credit Card</div>
                                    <div class="text-muted" style="font-size:0.7rem;">Simulated limit</div>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Card Details Form Area -->
                <div class="p-3 bg-light rounded-4 mb-4 border" style="border-color: var(--border-subtle)!important;">
                    <div class="mb-3">
                        <label class="form-label-custom" for="cardNumber">Card Number</label>
                        <input class="form-control form-control-modern" id="cardNumber" name="cardNumber" type="text" inputmode="numeric" maxlength="23" placeholder="4532 0150 0000 0000" required>
                    </div>
                    <div class="row g-3">
                        <div class="col-7">
                            <label class="form-label-custom" for="expiry">Expiry Date</label>
                            <input class="form-control form-control-modern" id="expiry" name="expiry" type="text" inputmode="numeric" maxlength="5" pattern="(0[1-9]|1[0-2])/[0-9]{2}" placeholder="MM/YY" required>
                        </div>
                        <div class="col-5">
                            <label class="form-label-custom" for="cvv">CVV</label>
                            <input class="form-control form-control-modern" id="cvv" name="cvv" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{3,4}" placeholder="123" required>
                        </div>
                    </div>
                </div>

                <!-- Amount Section -->
                <label class="form-label-custom">Amount to Add</label>
                <div class="currency-input-wrapper mb-3">
                    <span class="currency-symbol">₹</span>
                    <input type="number" class="currency-input-field" id="amount" name="amount" min="1" max="1000000" step="0.01" placeholder="0.00" required>
                </div>

                <div class="d-flex gap-2 flex-wrap mb-4">
                    <button type="button" class="amount-chip" data-amount="500">₹500</button>
                    <button type="button" class="amount-chip" data-amount="1000">₹1,000</button>
                    <button type="button" class="amount-chip" data-amount="2000">₹2,000</button>
                    <button type="button" class="amount-chip" data-amount="5000">₹5,000</button>
                </div>

                <button class="btn-emerald w-100 py-3 fs-6" type="submit">
                    <i class="bi bi-lock-fill"></i>
                    <span>Simulate Instant Top-Up</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        document.querySelectorAll('.amount-chip').forEach(function (button) {
            button.addEventListener('click', function () {
                document.getElementById('amount').value = button.dataset.amount;
                document.querySelectorAll('.amount-chip').forEach(c => c.classList.remove('active'));
                button.classList.add('active');
            });
        });
        document.getElementById('cardNumber').addEventListener('input', function (event) {
            var digits = event.target.value.replace(/\D/g, '').slice(0, 19);
            event.target.value = digits.replace(/(.{4})/g, '$1 ').trim();
        });
        document.getElementById('expiry').addEventListener('input', function (event) {
            var val = event.target.value.replace(/\D/g, '').slice(0, 4);
            if (val.length >= 3) {
                event.target.value = val.slice(0, 2) + '/' + val.slice(2);
            } else {
                event.target.value = val;
            }
        });
    </script>
</body>
</html>
