<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Savings Goals - Akhha Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .page-wrap {
            max-width: 1040px;
            margin: 0 auto;
            padding: 36px 18px 60px;
        }
        .progress-custom {
            height: 10px;
            background: #e2e8f0;
            border-radius: 9999px;
            overflow: hidden;
            margin: 12px 0 6px;
        }
        .progress-bar-custom {
            background: linear-gradient(90deg, #0f7a4c 0%, #10b981 100%);
            border-radius: 9999px;
            height: 100%;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a th:href="@{/dashboard}" class="btn-outline-custom mb-4 py-2 px-3 fw-bold small">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="text-uppercase fw-bold text-muted" style="font-size: 0.68rem; letter-spacing: 0.14em;">WEALTH BUILDING</span>
                <h2 class="fw-extrabold mb-0">Savings Goals</h2>
            </div>
        </div>

        <!-- Global Alerts -->
        <div th:if="${txSuccess}" class="alert alert-success border-0 rounded-4 shadow-sm mb-4" th:text="${txSuccess}"></div>
        <div th:if="${txError}" class="alert alert-danger border-0 rounded-4 shadow-sm mb-4" th:text="${txError}"></div>

        <div class="row g-4">
            <!-- Create Goal Card -->
            <div class="col-lg-4">
                <div class="card-modern shadow-sm h-100">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <div class="quick-action-icon icon-blue p-2" style="width:36px; height:36px; font-size:1rem;"><i class="bi bi-bullseye"></i></div>
                        <h5 class="fw-bold mb-0">Create Target</h5>
                    </div>
                    <p class="text-muted small mb-3">Set aside funds for a trip, gadget, or rainy day emergency reserve.</p>

                    <form th:action="@{/dashboard/savings}" method="post">
                        <div class="mb-3">
                            <label class="form-label-custom">Goal Name</label>
                            <input id="goalName" class="form-control form-control-modern" name="name" maxlength="60" placeholder="e.g. New iPhone, Vacation" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label-custom">Target Amount</label>
                            <div class="currency-input-wrapper">
                                <span class="currency-symbol" style="font-size:1.5rem;">₹</span>
                                <input id="goalTarget" class="currency-input-field" style="font-size:1.5rem;" name="targetAmount" type="number" min="0.01" max="100000000" step="0.01" placeholder="0.00" required>
                            </div>
                        </div>
                        <button class="btn-emerald w-100 py-3" type="submit">
                            <i class="bi bi-plus-lg me-1"></i> Start Saving
                        </button>
                    </form>
                </div>
            </div>

            <!-- Active Goals Feed -->
            <div class="col-lg-8">
                <div class="card-modern shadow-sm h-100">
                    <h5 class="fw-bold mb-3">Your Active Savings</h5>

                    <div th:if="${goals.isEmpty()}" class="text-center py-5 bg-light rounded-4">
                        <i class="bi bi-piggy-bank fs-2 text-muted"></i>
                        <p class="text-muted small mb-0 mt-2">No savings goals created yet. Set a target on the left to begin.</p>
                    </div>

                    <div th:unless="${goals.isEmpty()}" class="d-grid gap-3">
                        <div th:each="goal : ${goals}" class="p-3 bg-light rounded-4 border">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 class="fw-bold mb-1" th:text="${goal.name}">Goal Name</h6>
                                    <div class="text-muted small" th:text="'Target: ₹' + ${#numbers.formatDecimal(goal.targetAmount,1,2)}">Target ₹0.00</div>
                                </div>
                                <div class="text-end">
                                    <div class="fw-extrabold fs-5 text-success" th:text="'₹' + ${#numbers.formatDecimal(goal.savedAmount,1,2)}">₹0.00</div>
                                    <span class="badge bg-success-subtle text-success border border-success-subtle" th:text="${progress[goal.id]} + '% Achieved'">0% Achieved</span>
                                </div>
                            </div>

                            <!-- Progress Bar -->
                            <div class="progress-custom">
                                <div class="progress-bar-custom" th:style="'width:' + ${progress[goal.id]} + '%'"></div>
                            </div>

                            <!-- Goal Controls -->
                            <div class="row g-2 mt-2" th:if="${goal.status == 'ACTIVE'}">
                                <div class="col-sm-6">
                                    <form th:action="@{/dashboard/savings/{id}/contribute(id=${goal.id})}" method="post" class="p-2 bg-white rounded-3 border">
                                        <input type="hidden" name="operationKey" th:value="${contributeKeys[goal.id]}">
                                        <div class="fw-bold text-muted small mb-1"><i class="bi bi-plus-circle text-success me-1"></i>Deposit Funds</div>
                                        <input class="form-control form-control-modern form-control-sm mb-2" type="number" name="amount" min="0.01" step="0.01" placeholder="₹ Amount" required>
                                        <input class="form-control form-control-modern form-control-sm font-monospace text-center mb-2" type="password" name="pin" maxlength="4" placeholder="4-digit MPIN" required>
                                        <button class="btn btn-sm btn-emerald w-100" type="submit">Deposit</button>
                                    </form>
                                </div>
                                <div class="col-sm-6">
                                    <form th:action="@{/dashboard/savings/{id}/withdraw(id=${goal.id})}" method="post" class="p-2 bg-white rounded-3 border">
                                        <input type="hidden" name="operationKey" th:value="${withdrawKeys[goal.id]}">
                                        <div class="fw-bold text-muted small mb-1"><i class="bi bi-arrow-down-circle text-warning me-1"></i>Withdraw Funds</div>
                                        <input class="form-control form-control-modern form-control-sm mb-2" type="number" name="amount" min="0.01" step="0.01" th:attr="max=${goal.savedAmount}" placeholder="₹ Amount" required>
                                        <input class="form-control form-control-modern form-control-sm font-monospace text-center mb-2" type="password" name="pin" maxlength="4" placeholder="4-digit MPIN" required>
                                        <button class="btn btn-sm btn-outline-custom w-100" type="submit">Withdraw</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
