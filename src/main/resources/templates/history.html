<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Passbook History - Akhha Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .page-wrap {
            max-width: 680px;
            margin: 0 auto;
            padding: 40px 18px 60px;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a th:href="@{/dashboard}" class="btn-outline-custom mb-4 py-2 px-3 fw-bold small">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>

        <div class="card-modern shadow-lg">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div class="d-flex align-items-center gap-3">
                    <div class="quick-action-icon icon-amber" style="width:46px; height:46px; font-size:1.2rem;">
                        <i class="bi bi-receipt"></i>
                    </div>
                    <div>
                        <span class="text-uppercase fw-bold text-muted" style="font-size: 0.68rem; letter-spacing: 0.12em;">FINANCIAL STATEMENT</span>
                        <h3 class="fw-bold mb-0">Passbook Activity</h3>
                    </div>
                </div>
                <button type="button" class="btn-outline-custom py-2 px-3 small" onclick="window.print()">
                    <i class="bi bi-download me-1"></i> Print / PDF
                </button>
            </div>

            <!-- Transaction Feed -->
            <div th:if="${!transactions.isEmpty()}">
                <div th:each="tx : ${transactions}" class="tx-item">
                    <div class="d-flex align-items-center gap-3">
                        <div th:class="${tx.receiverPhone == user.phoneNumber || tx.status == 'BANK_DEPOSIT' || tx.status == 'OPENING_BALANCE'} ? 'tx-icon income' : 'tx-icon expense'">
                            <i th:if="${tx.receiverPhone == user.phoneNumber}" class="bi bi-arrow-down-left"></i>
                            <i th:if="${tx.status == 'BANK_DEPOSIT' || tx.status == 'OPENING_BALANCE'}" class="bi bi-plus-lg"></i>
                            <i th:if="${tx.senderPhone == user.phoneNumber && tx.status != 'BANK_DEPOSIT' && tx.status != 'OPENING_BALANCE'}" class="bi bi-arrow-up-right"></i>
                        </div>

                        <div>
                            <!-- Title Logic -->
                            <div class="tx-title" th:if="${tx.status == 'BANK_DEPOSIT'}">Card Top-Up</div>
                            <div class="tx-title" th:if="${tx.status == 'OPENING_BALANCE'}">Opening Balance</div>
                            <div class="tx-title" th:if="${tx.status != 'BANK_DEPOSIT' && tx.status != 'OPENING_BALANCE' && tx.senderPhone == user.phoneNumber}" th:text="'Sent to ' + ${tx.receiverPhone}">Sent Money</div>
                            <div class="tx-title" th:if="${tx.status != 'BANK_DEPOSIT' && tx.status != 'OPENING_BALANCE' && tx.receiverPhone == user.phoneNumber}" th:text="'Received from ' + ${tx.senderPhone}">Received Money</div>

                            <div class="tx-meta" th:text="${#temporals.format(tx.timestamp, 'dd MMM yyyy, hh:mm a')}">12 Oct 2026, 02:30 PM</div>

                            <span class="badge bg-light text-muted border font-monospace mt-1" style="font-size:0.65rem;" th:if="${tx.referenceId != null}" th:text="'Ref: ' + ${tx.referenceId}">Ref: 12345</span>
                        </div>
                    </div>

                    <div class="text-end">
                        <div th:class="${tx.receiverPhone == user.phoneNumber || tx.status == 'BANK_DEPOSIT' || tx.status == 'OPENING_BALANCE'} ? 'tx-amount positive' : 'tx-amount negative'"
                             th:text="${(tx.receiverPhone == user.phoneNumber || tx.status == 'BANK_DEPOSIT' || tx.status == 'OPENING_BALANCE') ? '+₹' : '-₹'} + ${#numbers.formatDecimal(tx.amount,1,2)}">
                            ₹0.00
                        </div>
                        <span class="status-badge completed mt-1">SUCCESS</span>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${transactions.isEmpty()}" class="text-center py-5">
                <div class="quick-action-icon icon-blue mx-auto mb-3" style="width:60px; height:60px; font-size:1.6rem;">
                    <i class="bi bi-inbox"></i>
                </div>
                <h5 class="fw-bold">No Transactions Found</h5>
                <p class="text-muted small mb-4">Your past wallet top-ups, peer transfers, and bills will be cataloged here.</p>
                <a th:href="@{/dashboard/add-funds}" class="btn-emerald py-2 px-4">
                    <i class="bi bi-plus-circle me-1"></i> Add Your First Funds
                </a>
            </div>
        </div>
    </div>
</body>
</html>
