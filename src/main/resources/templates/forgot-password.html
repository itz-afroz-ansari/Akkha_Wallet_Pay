<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - Akhha Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <style>
        .reset-box-wrap {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            padding: 44px 38px;
            box-shadow: 0 25px 70px -15px rgba(11, 41, 28, 0.16);
            border: 1px solid rgba(15, 122, 76, 0.1);
        }
        .key-badge-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: #ecfdf5;
            color: #0f7a4c;
            display: grid;
            place-items: center;
            font-size: 1.6rem;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(15, 122, 76, 0.15);
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="reset-box-wrap">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <a class="showcase-brand text-dark" th:href="@{/}">
                    <span class="showcase-logo" style="width:36px; height:36px; font-size:1rem;"><i class="bi bi-wallet2"></i></span>
                    <span class="fw-bold" style="font-size: 1.1rem; color: #0f172a;">AKHHA PAY</span>
                </a>
            </div>

            <div class="key-badge-icon">
                <i class="bi bi-key-fill"></i>
            </div>

            <h2 class="title" style="font-size: 1.8rem;">Reset Password</h2>
            <p class="subtitle">We'll dispatch a 6-digit recovery code to your registered email to reset your credentials.</p>

            <!-- Alerts -->
            <div th:if="${message}" class="alert-custom alert-success-custom">
                <i class="bi bi-check-circle-fill flex-shrink-0"></i>
                <span th:text="${message}"></span>
            </div>
            <div th:if="${error}" class="alert-custom alert-error">
                <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- Step 1: Send Code -->
            <form th:action="@{/forgot-password/send-code}" method="post" th:if="${codeSent != true}">
                <div class="field-group">
                    <label class="field-label">Account Email Address</label>
                    <input type="email" name="email" class="custom-input" required placeholder="name@example.com" autocomplete="email">
                </div>

                <button type="submit" class="btn-auth w-100">
                    <span>Send Verification Code</span>
                    <i class="bi bi-arrow-right ms-2"></i>
                </button>
            </form>

            <!-- Step 2: Reset Form -->
            <form th:action="@{/forgot-password/reset}" method="post" th:if="${codeSent == true}">
                <input type="hidden" name="email" th:value="${email}">
                
                <div class="field-group">
                    <label class="field-label">6-Digit Verification Code</label>
                    <input type="text" name="otp" class="custom-input text-center fw-bold" style="letter-spacing: 0.25em; font-size: 1.3rem;" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000" autocomplete="one-time-code">
                </div>

                <div class="field-group">
                    <label class="field-label">New Password</label>
                    <div class="position-relative">
                        <input type="password" name="newPassword" id="newPass" class="custom-input pe-5" required minlength="8" maxlength="128" placeholder="At least 8 characters">
                        <button type="button" class="btn btn-link text-muted position-absolute end-0 top-50 translate-middle-y me-2 text-decoration-none p-1" onclick="togglePass('newPass', this)" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label">Confirm New Password</label>
                    <div class="position-relative">
                        <input type="password" name="confirmPassword" id="confPass" class="custom-input pe-5" required minlength="8" maxlength="128" placeholder="Repeat new password">
                        <button type="button" class="btn btn-link text-muted position-absolute end-0 top-50 translate-middle-y me-2 text-decoration-none p-1" onclick="togglePass('confPass', this)" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-auth w-100">
                    <span>Save New Password &amp; Sign In</span>
                    <i class="bi bi-shield-check ms-2"></i>
                </button>
            </form>

            <div class="mt-4 pt-3 text-center border-top">
                <a th:href="@{/}" class="small text-decoration-none fw-bold" style="color: var(--auth-primary);">
                    <i class="bi bi-arrow-left me-1"></i> Return to Sign In
                </a>
            </div>
        </div>
    </div>

    <script>
        function togglePass(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }
    </script>
</body>
</html>
