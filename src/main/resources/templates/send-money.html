<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Send Money - Akhha Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .page-wrap {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 18px 60px;
        }
        .pin-box {
            background: #f8fafc;
            border: 2px solid var(--border-subtle);
            border-radius: 16px;
            padding: 12px;
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--slate-900);
            text-align: center;
            letter-spacing: 0.35em;
            padding-left: calc(12px + 0.35em);
            transition: all 0.2s ease;
        }
        .pin-box:focus {
            outline: none;
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }
        .pin-box::placeholder {
            color: #cbd5e1;
            letter-spacing: normal;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a th:href="@{/dashboard}" class="btn-outline-custom mb-4 py-2 px-3 fw-bold small">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>

        <div class="card-modern shadow-lg">
            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="quick-action-icon icon-blue" style="width:46px; height:46px; font-size:1.2rem;">
                    <i class="bi bi-send-fill"></i>
                </div>
                <div>
                    <span class="text-uppercase fw-bold text-muted" style="font-size: 0.68rem; letter-spacing: 0.12em;">TRANSFER FUNDS</span>
                    <h3 class="fw-bold mb-0">Send Money</h3>
                </div>
            </div>

            <!-- Dynamic alerts -->
            <div th:if="${txError}" class="alert alert-danger border-0 rounded-3 mb-3" th:text="${txError}"></div>

            <form th:action="@{/dashboard/transfer}" method="POST" id="sendMoneyForm">
                <input type="hidden" name="operationKey" th:value="${operationKey}">

                <!-- Big Amount Display Box -->
                <div class="currency-input-wrapper mb-3">
                    <span class="currency-symbol">₹</span>
                    <input type="number" class="currency-input-field" id="amountInput" name="amount" placeholder="0.00" min="0.01" max="1000000" step="0.01" required autofocus autocomplete="off">
                </div>

                <!-- Quick Amount Selector Pills -->
                <div class="d-flex gap-2 flex-wrap mb-4">
                    <button type="button" class="amount-chip" data-amount="100">₹100</button>
                    <button type="button" class="amount-chip" data-amount="500">₹500</button>
                    <button type="button" class="amount-chip" data-amount="1000">₹1,000</button>
                    <button type="button" class="amount-chip" data-amount="2000">₹2,000</button>
                    <button type="button" class="amount-chip" data-amount="5000">₹5,000</button>
                </div>

                <!-- Receiver Phone Field -->
                <div class="mb-4">
                    <label class="form-label-custom">Receiver Mobile Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted fw-bold font-monospace">+91</span>
                        <input type="tel" class="form-control form-control-modern border-start-0" name="receiverPhone" th:value="${receiverPhone}" placeholder="9876543210" inputmode="tel" maxlength="20" required>
                    </div>
                </div>

                <!-- 4-Digit MPIN Security PIN -->
                <div class="p-3 bg-light rounded-4 mb-4 text-center">
                    <label class="form-label-custom mb-2">Authorize with 4-Digit MPIN</label>
                    <input type="password" class="pin-box w-100" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="••••" required autocomplete="off" aria-label="4-digit MPIN">
                    <small class="text-muted d-block mt-2" style="font-size: 0.75rem;"><i class="bi bi-shield-lock me-1"></i>Never share your MPIN with anyone.</small>
                </div>

                <button type="submit" class="btn-emerald w-100 py-3 fs-6">
                    <i class="bi bi-lock-fill"></i>
                    <span>Confirm &amp; Send Money</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        document.querySelectorAll('.amount-chip').forEach(function(chip) {
            chip.addEventListener('click', function() {
                document.getElementById('amountInput').value = chip.dataset.amount;
                document.querySelectorAll('.amount-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
            });
        });
    </script>
</body>
</html>
