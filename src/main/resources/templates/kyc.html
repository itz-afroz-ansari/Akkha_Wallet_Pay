<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KYC Verification - Akhha Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .page-wrap {
            max-width: 540px;
            margin: 0 auto;
            padding: 40px 18px 60px;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a th:href="@{/dashboard}" class="btn-outline-custom mb-4 py-2 px-3 fw-bold small">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>

        <div class="card-modern shadow-lg text-center">
            <div class="quick-action-icon icon-emerald mx-auto mb-3" style="width:56px; height:56px; font-size:1.5rem;">
                <i class="bi bi-person-check-fill"></i>
            </div>

            <h3 class="fw-bold mb-1">Identity &amp; KYC Portal</h3>
            <p class="text-muted small mb-4">Verification unlocks higher transaction limits and enhanced security protections on your wallet.</p>

            <!-- Global Alerts -->
            <div th:if="${txSuccess}" class="alert alert-success border-0 rounded-4 shadow-sm mb-4" th:text="${txSuccess}"></div>
            <div th:if="${txError}" class="alert alert-danger border-0 rounded-4 shadow-sm mb-4" th:text="${txError}"></div>

            <!-- KYC Status Box -->
            <div class="p-4 bg-light rounded-4 mb-4 border text-start d-flex justify-content-between align-items-center">
                <div>
                    <div class="text-uppercase fw-bold text-muted" style="font-size:0.68rem; letter-spacing:0.12em;">VERIFICATION STATE</div>
                    <h5 class="fw-bold text-dark mb-0 mt-1" th:text="${#strings.replace(#strings.toUpperCase(user.kycStatus), '_', ' ')}">NOT STARTED</h5>
                </div>
                <div>
                    <span class="status-badge completed" th:if="${user.kycStatus == 'VERIFIED'}"><i class="bi bi-check-circle-fill"></i> VERIFIED</span>
                    <span class="status-badge pending" th:if="${user.kycStatus == 'SUBMITTED' || user.kycStatus == 'IN_REVIEW'}"><i class="bi bi-hourglass-split"></i> IN REVIEW</span>
                    <span class="status-badge failed" th:if="${user.kycStatus == 'REJECTED' || user.kycStatus == 'NOT_STARTED'}"><i class="bi bi-shield-x"></i> UNVERIFIED</span>
                </div>
            </div>

            <form th:if="${user.kycStatus == 'NOT_STARTED' or user.kycStatus == 'REJECTED'}" th:action="@{/dashboard/kyc/submit}" method="post">
                <button class="btn-emerald w-100 py-3 fs-6" type="submit">
                    <i class="bi bi-patch-check me-1"></i> Submit One-Click Verification
                </button>
            </form>

            <div class="p-3 bg-light rounded-4 mt-4 border text-muted small text-start">
                <i class="bi bi-shield-lock-fill text-success me-1"></i>
                <span>Your customer identity is stored with strict encrypted data protection standards.</span>
            </div>
        </div>
    </div>
</body>
</html>
