<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Demo verification - Akhha Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>:root{--ink:#10271e;--green:#0f7a4c;--muted:#78857d;--line:#e5ebe7}*{box-sizing:border-box}body{background:#f5f8f6;color:var(--ink);font-family:Inter,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(530px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:29px;box-shadow:0 18px 50px rgba(22,57,39,.08)}.back{color:var(--muted);font-size:.73rem;font-weight:800;letter-spacing:.1em;text-decoration:none}.icon{width:52px;height:52px;display:grid;place-items:center;background:#eaf5ef;color:var(--green);border-radius:16px;margin:23px 0 14px;font-size:1.25rem}.card h1{font:800 1.45rem Manrope,sans-serif}.card p{color:var(--muted);font-size:.83rem;line-height:1.55}.state{background:#f3f8f5;border:1px solid #dfebe3;border-radius:13px;padding:15px;margin:18px 0}.state span{display:block;color:var(--muted);font-size:.67rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.state strong{display:block;margin-top:5px;font:800 1rem Manrope,sans-serif}.btn-green{width:100%;border:0;border-radius:11px;background:var(--green);color:#fff;padding:13px;font-weight:800}.note{background:#fff8e8;border:1px solid #f2e5c5;border-radius:12px;padding:12px;font-size:.73rem;color:#716341;line-height:1.5}</style>
</head><body><main class="card"><a th:href="@{/dashboard}" class="back">&larr; DASHBOARD</a><div class="icon"><i class="bi bi-person-check"></i></div><h1>Identity verification</h1><p>This academic demo models a KYC review without collecting identity numbers, photos, or documents.</p>
    <div th:if="${txSuccess}" class="alert alert-success border-0" th:text="${txSuccess}"></div><div th:if="${txError}" class="alert alert-danger border-0" th:text="${txError}"></div>
    <div class="state"><span>Current status</span><strong th:text="${#strings.replace(#strings.toLowerCase(user.kycStatus), '_', ' ')}">Not started</strong></div>
    <form th:if="${user.kycStatus == 'NOT_STARTED' or user.kycStatus == 'REJECTED'}" th:action="@{/dashboard/kyc/submit}" method="post"><button class="btn-green" type="submit">Submit demo verification</button></form>
    <div class="note mt-3"><i class="bi bi-info-circle me-1"></i>Demo verification is not legal KYC and does not enable regulated banking or payment services.</div>
</main></body></html>
