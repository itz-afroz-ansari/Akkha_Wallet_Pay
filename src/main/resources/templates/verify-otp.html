<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify Identity - Akhha Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <style>
        .otp-box-wrap {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            padding: 48px 40px;
            box-shadow: 0 25px 70px -15px rgba(11, 41, 28, 0.16);
            border: 1px solid rgba(15, 122, 76, 0.1);
            text-align: center;
        }
        .otp-badge-icon {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: #ecfdf5;
            color: #0f7a4c;
            display: grid;
            place-items: center;
            font-size: 1.8rem;
            margin: 0 auto 24px;
            box-shadow: 0 8px 20px rgba(15, 122, 76, 0.15);
        }
        .otp-input-field {
            width: 100%;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            font-family: 'Manrope', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: #0f172a;
            text-align: center;
            letter-spacing: 0.35em;
            padding-left: calc(16px + 0.35em);
            transition: all 0.2s ease;
            margin-bottom: 24px;
        }
        .otp-input-field:focus {
            outline: none;
            background: #ffffff;
            border-color: #0f7a4c;
            box-shadow: 0 0 0 5px rgba(15, 122, 76, 0.15);
        }
        .otp-input-field::placeholder {
            color: #cbd5e1;
            letter-spacing: normal;
            font-weight: 500;
            font-size: 1.2rem;
        }
        .email-chip {
            background: #f1f5f9;
            color: #0f172a;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
            display: inline-block;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="otp-box-wrap">
            <div class="otp-badge-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <h2 class="title" style="text-align: center; font-size: 1.8rem;">Two-Factor Verification</h2>
            <p class="subtitle" style="text-align: center; margin-bottom: 24px;">
                Enter the 6-digit security code sent to <br>
                <span class="email-chip" th:text="${session.tempEmail != null ? session.tempEmail : 'your email address'}">your@email.com</span>
            </p>

            <!-- Alerts -->
            <div th:if="${error}" class="alert-custom alert-error text-start">
                <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
                <span th:text="${error}"></span>
            </div>
            <div th:if="${param.resent}" class="alert-custom alert-success-custom text-start">
                <i class="bi bi-check-circle-fill flex-shrink-0"></i>
                <span>A fresh 6-digit code has been dispatched to your email.</span>
            </div>

            <form th:action="@{/verify-otp}" method="post">
                <input type="text" name="otp" class="otp-input-field" placeholder="000000" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autofocus autocomplete="one-time-code" aria-label="6 digit verification code">

                <button type="submit" class="btn-auth w-100">
                    <span th:text="${session.otpPurpose == 'REGISTER'} ? 'Verify Email &amp; Complete Registration' : 'Verify Identity &amp; Sign In'">Verify &amp; Continue</span>
                    <i class="bi bi-arrow-right ms-2"></i>
                </button>
            </form>

            <div class="d-flex justify-content-between align-items-center mt-4 pt-2 border-top">
                <a th:href="@{/}" class="small text-muted text-decoration-none fw-semibold">
                    <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                </a>
                <form th:action="@{/resend-otp}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link p-0 text-decoration-none fw-bold" style="color: var(--auth-primary); font-size: 0.85rem;">
                        <i class="bi bi-arrow-repeat me-1"></i> Resend Code
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
