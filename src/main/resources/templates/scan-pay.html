<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scan &amp; Pay - Akhha Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .page-wrap {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 18px 60px;
        }
        .scanner-view-container {
            border-radius: 20px;
            overflow: hidden;
            background: #0f172a;
            margin: 20px 0 16px;
            min-height: 260px;
            display: grid;
            place-items: center;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a th:href="@{/dashboard}" class="btn-outline-custom mb-4 py-2 px-3 fw-bold small">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>

        <div class="card-modern shadow-lg">
            <div class="d-flex align-items-center gap-3 mb-2">
                <div class="quick-action-icon icon-cyan" style="width:46px; height:46px; font-size:1.2rem;">
                    <i class="bi bi-qr-code-scan"></i>
                </div>
                <div>
                    <span class="text-uppercase fw-bold text-muted" style="font-size: 0.68rem; letter-spacing: 0.12em;">CAMERA SCANNER</span>
                    <h3 class="fw-bold mb-0">Scan to Pay</h3>
                </div>
            </div>

            <p class="text-muted small mb-3">Scan an Akhha Pay QR code to instantly fill recipient details and transfer money.</p>

            <div class="scanner-view-container">
                <div id="qrReader" class="w-100"></div>
            </div>

            <div id="scanStatus" class="alert alert-info border-0 rounded-3 small py-2 text-center mb-3">
                <i class="bi bi-camera me-1"></i> Point your camera at a QR code to scan.
            </div>

            <!-- Manual Wallet ID Input -->
            <div class="p-3 bg-light rounded-4 border">
                <label class="form-label-custom mb-2">Or Enter Wallet ID Manually</label>
                <form id="walletForm" class="d-flex gap-2">
                    <input id="walletId" class="form-control form-control-modern" placeholder="WLT0000000000000" required maxlength="20">
                    <button class="btn-emerald py-2 px-3 text-nowrap" type="submit">
                        <span>Continue</span> <i class="bi bi-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" referrerpolicy="no-referrer"></script>
    <script>
      (function () {
        var status = document.getElementById('scanStatus');
        function continueWithWallet(wallet) {
          if (!/^WLT[A-Z0-9]{13}$/.test(wallet)) {
              status.className = 'alert alert-danger border-0 rounded-3 small py-2 text-center mb-3';
              status.textContent = 'Invalid Akhha Pay Wallet ID format.';
              return;
          }
          window.location.assign('/dashboard/pay?wallet=' + encodeURIComponent(wallet));
        }

        document.getElementById('walletForm').addEventListener('submit', function (event) {
          event.preventDefault();
          continueWithWallet(document.getElementById('walletId').value.trim().toUpperCase());
        });

        if (!window.Html5Qrcode) {
          status.textContent = 'Camera scanner unavailable. Enter wallet ID manually.';
          return;
        }

        var scanner = new Html5Qrcode('qrReader');
        scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 220, height: 220 } }, function (decoded) {
          try {
            var url = new URL(decoded);
            if (url.origin !== window.location.origin || url.pathname !== '/dashboard/pay') throw new Error('external');
            var wallet = url.searchParams.get('wallet') || '';
            scanner.stop().catch(function () {});
            continueWithWallet(wallet);
          } catch (_) {
            status.className = 'alert alert-warning border-0 rounded-3 small py-2 text-center mb-3';
            status.textContent = 'Unrecognized QR format. Please scan an Akhha Pay QR.';
          }
        }, function () {}).catch(function () {
          status.textContent = 'Camera permission not granted. Enter wallet ID manually below.';
        });
      })();
    </script>
</body>
</html>
