<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile - Akhha Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .page-wrap {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 18px 60px;
        }
        .profile-avatar-lg {
            width: 88px;
            height: 88px;
            border-radius: 28px;
            background: linear-gradient(135deg, #0f7a4c 0%, #10b981 100%);
            color: #ffffff;
            display: grid;
            place-items: center;
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 auto 16px;
            box-shadow: 0 12px 28px -6px var(--primary-glow);
        }
        .profile-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        .profile-meta-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a th:href="@{/dashboard}" class="btn-outline-custom mb-4 py-2 px-3 fw-bold small">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>

        <div class="card-modern shadow-lg text-center mb-4">
            <div class="profile-avatar-lg">
                <span th:text="${user.name != null ? #strings.substring(user.name, 0, 1).toUpperCase() : 'U'}">U</span>
            </div>

            <h3 class="fw-extrabold mb-1" th:text="${user.name}">User Name</h3>
            <div class="text-muted small mb-3" th:text="${user.email}">user@email.com</div>

            <div class="d-flex justify-content-center gap-2 mb-4">
                <span class="status-badge completed"><i class="bi bi-shield-check"></i> ACTIVE CUSTOMER</span>
                <span class="status-badge pending" th:if="${user.role == 'ADMIN'}"><i class="bi bi-star-fill"></i> ADMIN</span>
            </div>

            <!-- Details Stack -->
            <div class="p-3 bg-light rounded-4 text-start">
                <div class="profile-meta-row">
                    <span class="text-muted small fw-semibold">Mobile Number</span>
                    <span class="fw-bold text-dark font-monospace" th:text="${user.phoneNumber}">9876543210</span>
                </div>
                <div class="profile-meta-row">
                    <span class="text-muted small fw-semibold">Wallet Account ID</span>
                    <span class="fw-bold text-dark font-monospace small" th:text="${user.wallet != null ? user.wallet.walletNumber : 'WLT-PENDING'}">WLT0000000000</span>
                </div>
                <div class="profile-meta-row">
                    <span class="text-muted small fw-semibold">KYC Verification</span>
                    <span class="status-badge completed" th:if="${user.kycStatus == 'VERIFIED'}">VERIFIED</span>
                    <span class="status-badge pending" th:unless="${user.kycStatus == 'VERIFIED'}" th:text="${user.kycStatus}">PENDING</span>
                </div>
                <div class="profile-meta-row">
                    <span class="text-muted small fw-semibold">Reward Points</span>
                    <span class="fw-extrabold text-success" th:text="${user.rewardPoints != null ? user.rewardPoints : 0} + ' Points'">0 Points</span>
                </div>
            </div>

            <div class="row g-2 mt-4">
                <div class="col-6">
                    <a th:href="@{/dashboard/security}" class="btn-outline-custom w-100 py-2 fs-6">
                        <i class="bi bi-shield-lock"></i> Security &amp; PIN
                    </a>
                </div>
                <div class="col-6">
                    <a th:href="@{/dashboard/kyc}" class="btn-emerald w-100 py-2 fs-6">
                        <i class="bi bi-person-check"></i> KYC Portal
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
