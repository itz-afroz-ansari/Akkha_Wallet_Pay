<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My QR Code - Akhha Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .page-wrap {
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 18px 60px;
        }
        .qr-frame {
            display: inline-grid;
            place-items: center;
            padding: 24px;
            background: #ffffff;
            border: 2px dashed rgba(15, 122, 76, 0.25);
            border-radius: 24px;
            margin: 16px auto 20px;
            box-shadow: 0 10px 30px -10px rgba(15, 122, 76, 0.12);
        }
    </style>
</head>
<body>
    <div class="page-wrap text-center">
        <div class="text-start mb-4">
            <a th:href="@{/dashboard}" class="btn-outline-custom py-2 px-3 fw-bold small">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <div class="card-modern shadow-lg" th:data-wallet="${wallet.walletNumber}" id="qrCard">
            <div class="quick-action-icon icon-purple mx-auto mb-3" style="width:56px; height:56px; font-size:1.5rem;">
                <i class="bi bi-qr-code"></i>
            </div>

            <h3 class="fw-bold mb-1">Receive by QR</h3>
            <p class="text-muted small mb-3">Let any Akhha Pay user scan this QR code to transfer money to you instantly.</p>

            <div class="qr-frame">
                <div id="walletQr" aria-label="Wallet payment QR code"></div>
            </div>

            <div class="p-3 bg-light rounded-4 mb-4">
                <div class="text-uppercase fw-bold text-muted mb-1" style="font-size:0.68rem; letter-spacing:0.12em;">PERSONAL WALLET ID</div>
                <div class="fw-extrabold font-monospace fs-6 text-dark text-break" th:text="${wallet.walletNumber}">WLT0000000000000</div>
            </div>

            <div class="row g-2">
                <div class="col-6">
                    <a th:href="@{/dashboard/scan}" class="btn-emerald w-100 py-2 fs-6">
                        <i class="bi bi-camera"></i> Scan to Pay
                    </a>
                </div>
                <div class="col-6">
                    <button class="btn-outline-custom w-100 py-2 fs-6" type="button" onclick="window.print()">
                        <i class="bi bi-printer"></i> Save / Print
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" referrerpolicy="no-referrer"></script>
    <script>
      (function () {
        var card = document.getElementById('qrCard');
        var wallet = card && card.dataset.wallet;
        var target = document.getElementById('walletQr');
        if (!wallet || !target || !window.QRCode) {
            if (target) target.textContent = 'QR generator unavailable';
            return;
        }
        var payload = window.location.origin + '/dashboard/pay?wallet=' + encodeURIComponent(wallet);
        new QRCode(target, {
            text: payload,
            width: 200,
            height: 200,
            colorDark: '#0f172a',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });
      })();
    </script>
</body>
</html>
