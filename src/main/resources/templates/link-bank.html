<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Bank Account - Akhha Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .page-wrap {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 18px 60px;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a th:href="@{/dashboard/banks}" class="btn-outline-custom mb-4 py-2 px-3 fw-bold small">
            <i class="bi bi-arrow-left"></i> Back to Bank Accounts
        </a>

        <div class="card-modern shadow-lg">
            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="quick-action-icon icon-cyan" style="width:46px; height:46px; font-size:1.2rem;">
                    <i class="bi bi-bank"></i>
                </div>
                <div>
                    <span class="text-uppercase fw-bold text-muted" style="font-size: 0.68rem; letter-spacing: 0.12em;">BANK INTEGRATION</span>
                    <h3 class="fw-bold mb-0">Link Bank Account</h3>
                </div>
            </div>

            <p class="text-muted small mb-4">Connect your savings or current account securely to Akhha Pay.</p>

            <form th:action="@{/dashboard/link-bank}" method="POST" id="linkBankForm">
                <div class="mb-3">
                    <label class="form-label-custom">Select Bank</label>
                    <select class="form-select form-control-modern" name="bankName" required>
                        <option value="" disabled selected>Choose your bank</option>
                        <option value="State Bank of India">State Bank of India (SBI)</option>
                        <option value="HDFC Bank">HDFC Bank</option>
                        <option value="ICICI Bank">ICICI Bank</option>
                        <option value="Axis Bank">Axis Bank</option>
                        <option value="Kotak Mahindra Bank">Kotak Mahindra Bank</option>
                        <option value="Punjab National Bank">Punjab National Bank</option>
                        <option value="Bank of Baroda">Bank of Baroda</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label-custom">Bank Account Number</label>
                    <input type="password" class="form-control form-control-modern" name="accountNumber" placeholder="Enter account number" required autocomplete="off">
                </div>

                <div class="mb-4">
                    <label class="form-label-custom">IFSC Code</label>
                    <input type="text" class="form-control form-control-modern text-uppercase font-monospace" name="ifscCode" placeholder="e.g. SBIN0001234" maxlength="11" required>
                </div>

                <button type="submit" class="btn-emerald w-100 py-3 fs-6">
                    <i class="bi bi-shield-check"></i>
                    <span>Verify &amp; Link Account</span>
                </button>

                <div class="d-flex align-items-center justify-content-center gap-2 mt-4 pt-3 border-top text-muted small">
                    <i class="bi bi-lock-fill text-success"></i>
                    <span>Bank-grade 256-bit encryption standard</span>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
