<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recharge &amp; Utility Bills - Akhha Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .page-wrap {
            max-width: 1040px;
            margin: 0 auto;
            padding: 36px 18px 60px;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a th:href="@{/dashboard}" class="btn-outline-custom mb-4 py-2 px-3 fw-bold small">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="text-uppercase fw-bold text-muted" style="font-size: 0.68rem; letter-spacing: 0.14em;">UTILITIES &amp; RECHARGES</span>
                <h2 class="fw-extrabold mb-0">Recharge &amp; Bill Payments</h2>
            </div>
        </div>

        <!-- Global Alerts -->
        <div th:if="${txSuccess}" class="alert alert-success border-0 rounded-4 shadow-sm mb-4" th:text="${txSuccess}"></div>
        <div th:if="${txError}" class="alert alert-danger border-0 rounded-4 shadow-sm mb-4" th:text="${txError}"></div>

        <div class="row g-4">
            <!-- Payment Form -->
            <div class="col-lg-5">
                <div class="card-modern shadow-sm h-100">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <div class="quick-action-icon icon-emerald p-2" style="width:36px; height:36px; font-size:1rem;"><i class="bi bi-lightning-charge-fill"></i></div>
                        <h5 class="fw-bold mb-0">Pay Biller</h5>
                    </div>
                    <p class="text-muted small mb-3">Instant bill settlements &amp; mobile recharge from your wallet.</p>

                    <form th:action="@{/dashboard/services/pay}" method="post" id="serviceForm">
                        <input type="hidden" name="operationKey" th:value="${operationKey}">

                        <div class="mb-3">
                            <label class="form-label-custom">Select Service</label>
                            <select id="serviceType" class="form-select form-control-modern" name="serviceType" required>
                                <option value="MOBILE_RECHARGE">Mobile Prepaid Recharge</option>
                                <option value="DTH_RECHARGE">DTH Satellite TV</option>
                                <option value="BROADBAND">Broadband Internet</option>
                                <option value="ELECTRICITY">Electricity Power</option>
                                <option value="WATER">Water Utility</option>
                                <option value="GAS">Piped Gas / Cylinder</option>
                                <option value="FASTAG">FASTag Toll Top-up</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label-custom">Operator / Biller Name</label>
                            <input id="provider" class="form-control form-control-modern" name="provider" maxlength="60" placeholder="e.g. Airtel, Tata Play, Adani Power" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label-custom">Consumer / Account Reference</label>
                            <input id="accountReference" class="form-control form-control-modern" name="accountReference" minlength="3" maxlength="80" placeholder="e.g. 10-digit mobile or consumer ID" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label-custom">Bill Amount</label>
                            <div class="currency-input-wrapper">
                                <span class="currency-symbol" style="font-size:1.5rem;">₹</span>
                                <input id="amount" class="currency-input-field" style="font-size:1.5rem;" name="amount" type="number" min="0.01" max="1000000" step="0.01" placeholder="0.00" required>
                            </div>
                        </div>

                        <button class="btn-emerald w-100 py-3" type="submit">
                            <i class="bi bi-shield-check me-1"></i> Pay Bill from Wallet
                        </button>
                    </form>
                </div>
            </div>

            <!-- Recent Bill Payments Feed -->
            <div class="col-lg-7">
                <div class="card-modern shadow-sm h-100">
                    <h5 class="fw-bold mb-3">Recent Utility Payments</h5>

                    <div th:if="${servicePayments.isEmpty()}" class="text-center py-5 bg-light rounded-4">
                        <i class="bi bi-receipt-cutoff fs-2 text-muted"></i>
                        <p class="text-muted small mb-0 mt-2">No utility bill payments yet.</p>
                    </div>

                    <div th:unless="${servicePayments.isEmpty()}" class="d-grid gap-2">
                        <div th:each="payment : ${servicePayments}" class="tx-item">
                            <div class="d-flex align-items-center gap-3">
                                <div class="tx-icon expense"><i class="bi bi-lightning-charge"></i></div>
                                <div>
                                    <div class="tx-title" th:text="${#strings.replace(#strings.toUpperCase(payment.serviceType), '_', ' ')}">SERVICE</div>
                                    <div class="tx-meta" th:text="${payment.providerName + ' · ' + payment.accountReference}">Provider</div>
                                    <div class="tx-meta" th:text="${#temporals.format(payment.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</div>
                                </div>
                            </div>
                            <div class="text-end">
                                <div class="tx-amount negative" th:text="'−₹' + ${#numbers.formatDecimal(payment.amount,1,2)}">−₹0.00</div>
                                <span class="status-badge completed mt-1" th:text="${payment.status}">SUCCESS</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
