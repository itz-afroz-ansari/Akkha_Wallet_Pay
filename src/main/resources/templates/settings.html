<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account Settings - Akhha Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .page-wrap {
            max-width: 600px;
            margin: 0 auto;
            padding: 36px 18px 60px;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a th:href="@{/dashboard}" class="btn-outline-custom mb-4 py-2 px-3 fw-bold small">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="text-uppercase fw-bold text-muted" style="font-size: 0.68rem; letter-spacing: 0.14em;">PREFERENCES &amp; CONTROLS</span>
                <h2 class="fw-extrabold mb-0">Account Settings</h2>
            </div>
            <div class="quick-action-icon icon-emerald" style="width:46px; height:46px; font-size:1.2rem;">
                <i class="bi bi-gear-fill"></i>
            </div>
        </div>

        <!-- Global Alerts -->
        <div th:if="${txSuccess}" class="alert alert-success border-0 rounded-4 shadow-sm mb-4" th:text="${txSuccess}"></div>
        <div th:if="${txError}" class="alert alert-danger border-0 rounded-4 shadow-sm mb-4" th:text="${txError}"></div>

        <!-- Wallet Freeze/Unfreeze Controls -->
        <div class="card-modern shadow-sm mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h5 class="fw-bold mb-1">Wallet Status Controls</h5>
                    <p class="text-muted small mb-0">Temporarily freeze outgoing payments for safety.</p>
                </div>
                <span class="status-badge" th:classappend="${wallet.status == 'ACTIVE'} ? 'completed' : 'failed'" th:text="${wallet.status}">ACTIVE</span>
            </div>

            <form th:action="@{/dashboard/wallet-status}" method="post" class="p-3 bg-light rounded-4 border">
                <div class="row g-2 align-items-end">
                    <div class="col-sm-4">
                        <label class="form-label-custom">Action</label>
                        <select class="form-select form-control-modern" name="action">
                            <option value="FREEZE" th:if="${wallet.status == 'ACTIVE'}">Freeze Wallet</option>
                            <option value="UNFREEZE" th:if="${wallet.status != 'ACTIVE'}">Unfreeze Wallet</option>
                        </select>
                    </div>
                    <div class="col-sm-5">
                        <label class="form-label-custom">4-Digit MPIN</label>
                        <input class="form-control form-control-modern text-center font-monospace" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="••••" required autocomplete="off">
                    </div>
                    <div class="col-sm-3">
                        <button class="btn btn-emerald w-100 py-2" type="submit">Update</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Danger Zone: Close Account -->
        <div class="card-modern shadow-sm border-danger border-opacity-25" style="background: linear-gradient(135deg, #ffffff 0%, #fef2f2 100%);">
            <div class="d-flex align-items-center gap-2 mb-2 text-danger">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                <h5 class="fw-bold mb-0">Close Wallet Account</h5>
            </div>
            <p class="text-muted small mb-4">Permanently disable your Akhha Pay account. Please ensure your balance is zero before closing.</p>

            <form th:action="@{/dashboard/delete-account}" method="POST">
                <div class="mb-3">
                    <label class="form-label-custom text-danger">Account Password Confirmation</label>
                    <input type="password" class="form-control form-control-modern" name="password" placeholder="Enter password to confirm" required>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="confirmDelete" required>
                    <label class="form-check-label small text-muted" for="confirmDelete">
                        I understand that closing my wallet account is irreversible.
                    </label>
                </div>

                <button type="submit" class="btn btn-danger w-100 py-3 fw-bold rounded-3">
                    <i class="bi bi-trash3 me-1"></i> Close Account Permanently
                </button>
            </form>
        </div>
    </div>
</body>
</html>
